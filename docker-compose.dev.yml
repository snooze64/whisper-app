# Development override for docker-compose
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This override file configures the celery-worker to run without GPU
# for local development and testing.
#
# NOTE: The deploy.resources.reservations.devices cannot be overridden in compose override files.
# For development without GPU, comment out the celery-worker section in docker-compose.yml
# and start only the necessary services.

version: '3.8'

services:
  backend:
    # Ensure backend uses dev dockerfile
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
