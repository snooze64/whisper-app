# Complete development docker-compose without GPU
# Usage: docker-compose -f docker-compose.dev-full.yml up

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whisper-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whisper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d whisper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whisper-network

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: whisper-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whisper-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: whisper-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - upload-data:/data/uploads
      - result-data:/data/results
      - temp-data:/data/temp
      - model-cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/whisper
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:5174","http://localhost:8001"]
      - USE_MOCK_AUTH=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whisper-network

  # Celery Worker (Development - no GPU)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: whisper-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 --queues transcription
    volumes:
      - ./backend:/app
      - upload-data:/data/uploads
      - result-data:/data/results
      - temp-data:/data/temp
      - model-cache:/root/.cache/huggingface
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/whisper
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # No CUDA_VISIBLE_DEVICES - will use CPU/mock mode
    depends_on:
      - redis
      - postgres
    networks:
      - whisper-network

  # Frontend Development Server (Vite)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: whisper-frontend-dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - whisper-network

volumes:
  postgres-data:
  redis-data:
  upload-data:
  result-data:
  temp-data:
  model-cache:

networks:
  whisper-network:
    driver: bridge
