version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whisper-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whisper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d whisper"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whisper-network

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: whisper-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whisper-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: whisper-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - upload-data:/data/uploads
      - result-data:/data/results
      - temp-data:/data/temp
      - model-cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@postgres:5432/whisper}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:5174","http://localhost:8001"]}
      - LDAP_SERVER=${LDAP_SERVER:-ldap://ldap-server:389}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-dc=example,dc=com}
      - LDAP_USER_DN_TEMPLATE=${LDAP_USER_DN_TEMPLATE:-uid={username},ou=users,dc=example,dc=com}
      - USE_MOCK_AUTH=${USE_MOCK_AUTH:-true}
      - DEFAULT_WHISPER_MODEL=${DEFAULT_WHISPER_MODEL:-large-v3-turbo}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-ja}
      - GPU_MEMORY_THRESHOLD_MB=${GPU_MEMORY_THRESHOLD_MB:-10000}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whisper-network

  # Celery Worker (Development - CPU)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.cpu
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: whisper-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 --queues transcription
    volumes:
      - ./backend:/app
      - upload-data:/data/uploads
      - result-data:/data/results
      - temp-data:/data/temp
      - model-cache:/root/.cache/huggingface
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://user:password@postgres:5432/whisper}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - DEFAULT_WHISPER_MODEL=${DEFAULT_WHISPER_MODEL:-large-v3-turbo}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-ja}
      - GPU_MEMORY_THRESHOLD_MB=${GPU_MEMORY_THRESHOLD_MB:-10000}
      # - WHISPER_BACKEND=transformers  # Uncomment for CUDA 11.4 environments
      # GPU configuration removed for development (CPU only)
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-}
    depends_on:
      - redis
      - postgres
    networks:
      - whisper-network

  # Frontend Development Server (Vite)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=${NO_PROXY:-}
    container_name: whisper-frontend-dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-}
    depends_on:
      - backend
    networks:
      - whisper-network

volumes:
  postgres-data:
  redis-data:
  upload-data:
  result-data:
  temp-data:
  model-cache:

networks:
  whisper-network:
    driver: bridge
